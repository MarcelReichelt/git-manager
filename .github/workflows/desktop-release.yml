name: desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/desktop-release.yml
      - electron-builder.yml
      - package.json
      - yarn.lock
      - scripts/pack-desktop.mjs
      - scripts/ensure-electron-natives.mjs
      - src/desktop/**
      - src/runtime-env.ts
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  pack:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    env:
      # .yarnrc.yml reads NPM_TOKEN for every Yarn command, including the
      # setup-node cache lookup. The desktop build does not publish.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: mac
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Linux build tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          packages="python3 make g++ xvfb libnss3 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libxss1 libxtst6 libatspi2.0-0 libsecret-1-0"
          sudo apt-get install -y $packages libgtk-3-0t64 libasound2t64 || sudo apt-get install -y $packages libgtk-3-0 libasound2

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Pack the desktop app
        run: yarn pack:desktop

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-artifacts
          find release -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) -exec cp {} release-artifacts/ \;
          ls -lh release-artifacts
          test -n "$(ls -A release-artifacts)"

      - uses: actions/upload-artifact@v4
        with:
          name: git-worktree-manager-${{ matrix.os }}
          path: release-artifacts/*
          if-no-files-found: error

  # Publish after every pack so the changelog is written once.
  publish:
    name: publish
    needs: pack
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.pack.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: git-worktree-manager-*
          path: release-artifacts
          merge-multiple: true

      - name: Require an installer
        run: test -n "$(find release-artifacts -type f -print -quit)"

      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*

      - name: Write the changelog once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          body="$(gh release view "$tag" --json body --jq .body)"
          if [ -n "$body" ]; then
            echo "Release text is already set."
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$tag" --jq .body > release-notes.md
          gh release edit "$tag" --notes-file release-notes.md
