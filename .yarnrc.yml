approvedGitRepositories:
  - "**"

enableScripts: true

injectEnvironmentFiles:
  - .env?

nodeLinker: node-modules

npmMinimalAgeGate: 0

npmScopes:
  git-worktree-manager:
    npmAuthToken: "${NPM_TOKEN}"
    npmPublishRegistry: "https://git.mreichelt.dev/git-worktree-manager/~npm/"
    npmRegistryServer: "https://git.mreichelt.dev/git-worktree-manager/~npm/"

yarnPath: .yarn/releases/yarn-4.17.0.cjs
