# End-to-end test stack: a real Gitea git server + a runner that drives the
# built CLI against it.
#
#   yarn test:e2e:docker
#     (== docker compose -f docker-compose.e2e.yml up --build \
#         --abort-on-container-exit --exit-code-from e2e)
#
# The runner and the git server run in separate containers, but running them in
# one container would be equally valid -- git over localhost exercises the same
# client code paths.

services:
  gitea:
    image: gitea/gitea:1
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__server__ROOT_URL: "http://gitea:3000/"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__log__LEVEL: warn
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  e2e:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      GITEA_URL: "http://gitea:3000"
      GITEA_USER: tester
      GITEA_PASSWORD: tester-password-123
      GITEA_EMAIL: tester@example.com
    command: ["yarn", "test:e2e"]
